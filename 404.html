<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Page Not Found | Prime Hospital Biratnagar</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Devanagari:wght@400;500;600;700&family=Plus+Jakarta+Sans:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link rel="icon" type="image/jpeg" href="logo.jpg">
<link rel="stylesheet" href="style.css">
<style>
.error-page{min-height:80vh;display:flex;align-items:center;justify-content:center;text-align:center;padding:40px 20px}
.error-box{max-width:560px;background:#fff;padding:48px 32px;border-radius:var(--r);box-shadow:var(--sh);border:1px solid var(--line)}
.error-code{font-size:5rem;font-weight:800;color:var(--g);line-height:1;margin-bottom:12px}
.error-box h1{font-size:1.8rem;margin-bottom:12px;color:var(--gx)}
.error-box p{color:var(--gray);margin-bottom:28px}
</style>
</head>
<body>
<header class="nav">
  <div class="container nav-in">
    <a href="index.html" class="brand"><img src="logo.jpg" alt="Prime Hospital logo"><span><b>PRIME HOSPITAL</b><small>प्राइम हस्पिटल</small></span></a>
    <a href="index.html" class="btn btn-primary">Return Home</a>
  </div>
</header>
<main class="error-page">
  <div class="error-box">
    <div class="error-code">404</div>
    <h1>Page Not Found</h1>
    <p>The page you are looking for might have been moved, removed, or is temporarily unavailable.</p>
    <div class="btns center">
      <a href="index.html" class="btn btn-primary"><i class="fa-solid fa-house"></i> Go to Homepage</a>
      <a href="index.html#appointment" class="btn btn-light"><i class="fa-solid fa-calendar-check"></i> Book Appointment</a>
    </div>
  </div>
</main>
<footer class="footer">
  <div class="copy">© 2026 Prime Hospital. All Rights Reserved.</div>
</footer>
</body>
</html>
